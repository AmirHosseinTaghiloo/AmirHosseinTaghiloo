<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Amir Hossein Taghiloo — Frontend Developer</title>
<desc id="desc">Orange and dark gradient profile banner for a Vue.js and Nuxt.js frontend developer.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset=".52" stop-color="#241306"/><stop offset="1" stop-color="#7c2d12"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#fb923c" stop-opacity=".42"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></radialGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#fdba74"/><stop offset="1" stop-color="#f97316"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<rect width="1200" height="300" rx="24" fill="url(#bg)"/>
<circle cx="1000" cy="80" r="250" fill="url(#glow)" filter="url(#blur)"/>
<circle cx="110" cy="290" r="210" fill="url(#glow)" filter="url(#blur)"/>
<g fill="none" stroke="#fb923c" stroke-opacity=".18">
 <path d="M0 230 Q260 80 510 230 T1200 180" stroke-width="2"/>
 <path d="M0 255 Q260 105 510 255 T1200 205" stroke-width="1"/>
 <path d="M830 0 L1200 300 M900 0 L1200 240 M1020 0 L1200 150" />
</g>
<g transform="translate(82 78)">
 <rect width="66" height="66" rx="18" fill="#f97316" fill-opacity=".16" stroke="#fb923c" stroke-opacity=".8"/>
 <path d="M18 20 L7 33 L18 46 M48 20 L59 33 L48 46 M39 15 L27 51" fill="none" stroke="url(#accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="178" y="112" fill="#fff7ed" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="800">Amir Hossein <tspan fill="#fb923c">Taghiloo</tspan></text>
<text x="180" y="162" fill="#fed7aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="600">Junior Frontend Developer</text>
<text x="180" y="202" fill="#e5e7eb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Vue.js  •  Nuxt.js  •  JavaScript  •  TypeScript</text>
<rect x="180" y="230" width="250" height="4" rx="2" fill="url(#accent)"/>
<text x="180" y="266" fill="#fdba74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="3">BUILD  •  LEARN  •  IMPROVE</text>
<g transform="translate(1030 115)" opacity=".9">
 <path d="M0 0h70v70H0z" rx="12" fill="#f97316" fill-opacity=".12" stroke="#fb923c" stroke-opacity=".5"/>
 <path d="M17 18h36v7H17z M17 32h27v7H17z M17 46h36v7H17z" fill="#fdba74"/>
</g>
</svg>